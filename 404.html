<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script>
        // Obtém o nome do repositório
        const pathSegments = window.location.pathname.split('/');
        const repoName = pathSegments[1]; 
        const basePath = `/${repoName}`; 

        // O caminho que o usuário tentou acessar 
        const requestedPath = window.location.pathname;
        // O hash atual 
        const currentHash = window.location.hash;


        let targetPath = basePath + '/index.html'; // Padrão: ir para index.html


        if (!requestedPath.endsWith(basePath + '/') && !requestedPath.endsWith(basePath + '/index.html') && !currentHash) {
            // Pega o que vem depois de /ProjetoWebDesign/
            const relativePath = requestedPath.substring(basePath.length); 
            // Adiciona como hash
            targetPath += `#${relativePath}`; 
        } else if (currentHash) {
            // Se já tem hash, mantém o hash (para o caso de redirecionamentos internos no 404)
            targetPath += currentHash;
        }

        // Usa replaceState para mudar a URL no histórico sem recarregar inicialmente,
        // mas adicionando o hash para que o JS principal possa ler.
        history.replaceState(null, null, targetPath);

        // Força o redirecionamento para o index.html, garantindo que o servidor estático
        // sempre sirva o arquivo principal. O JS do index.html irá ler o hash.
        window.location.replace(targetPath);

    </script>
</head>
<body>
    <p>Redirecionando para a página principal...</p>
</body>
</html>
