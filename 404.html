<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script>
        // Obtém o nome do repositório (ex: 'ProjetoWebDesign')
        const pathSegments = window.location.pathname.split('/');
        const repoName = pathSegments[1]; 
        const basePath = `/${repoName}`; 

        // Obtém o caminho completo atual sem o nome do repositório e sem a barra inicial
        // Isso é o que vem DEPOIS de /ProjetoWebDesign/ (ex: 'about', 'contact')
        const currentRelativePath = window.location.pathname.substring(basePath.length);

        // A linha abaixo usa template literals (backticks ` `) corretamente
        // para incorporar variáveis.
        history.replaceState(null, null, `${basePath}/index.html${currentRelativePath}`);
        // O window.location.replace é um fallback forte que força o navegador a carregar index.html
        window.location.replace(`${basePath}/index.html${currentRelativePath}`); 
    </script>
</head>
<body>
    <p>Redirecionando para a página principal...</p>
</body>
</html>
